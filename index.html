<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🧬 سباق الصيادين: أسرار الهرمونات</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-void:#050b14;
  --bg-deep:#0a1626;
  --bg-panel:#0f1f33;
  --bg-panel-2:#142943;
  --line:rgba(120,200,255,.16);
  --teal:#2de8c7;
  --teal-dim:#1a9c85;
  --cyan:#3fd0ff;
  --violet:#a45bff;
  --magenta:#ff5fd1;
  --amber:#ffb545;
  --danger:#ff4d6d;
  --danger-dim:#7a2233;
  --ok:#3fe07a;
  --ink:#eaf6ff;
  --ink-dim:#8fb0c9;
  --ink-faint:#5b7a92;
  --gold:#ffd35c;
  --font-ar:'Cairo','Tajawal',Tahoma,Arial,sans-serif;
  --font-alt:'Tajawal','Cairo',Tahoma,Arial,sans-serif;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:24px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
html{scroll-padding-top:var(--safe-t);}
body{
  font-family:var(--font-ar);
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(45,232,199,.12), transparent 60%),
    radial-gradient(ellipse 900px 600px at 110% 10%, rgba(164,91,255,.14), transparent 55%),
    radial-gradient(ellipse 1200px 800px at 50% 120%, rgba(63,208,255,.08), transparent 60%),
    var(--bg-void);
  color:var(--ink);
  min-height:100%;
  overflow-x:hidden;
  padding-top:var(--safe-t);
  padding-bottom:var(--safe-b);
  position:relative;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 85% 20%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.35), transparent),
    radial-gradient(1.5px 1.5px at 10% 65%, rgba(255,255,255,.3), transparent);
  background-size:100% 100%;
  opacity:.6;
  pointer-events:none;
  z-index:0;
}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img,svg{display:block;max-width:100%;}
::selection{background:var(--teal);color:#00231c;}
.hidden{display:none !important;}
.scr{width:100%;max-width:720px;margin:0 auto;padding:18px 16px calc(20px + var(--safe-b));flex:1;display:flex;flex-direction:column;min-height:100vh;}
.wide{max-width:960px;}
.center-col{align-items:center;justify-content:center;text-align:center;}

/* ---- Typography ---- */
h1,h2,h3{font-family:var(--font-ar);line-height:1.25;}
.eyebrow{font-size:13px;color:var(--teal);font-weight:700;letter-spacing:.02em;}
.big-title{font-size:clamp(26px,7vw,40px);font-weight:900;color:var(--ink);text-shadow:0 0 24px rgba(45,232,199,.35);}
.sub{color:var(--ink-dim);font-size:15px;line-height:1.7;}
.cinema-line{font-size:17px;color:var(--cyan);font-weight:700;min-height:26px;}

/* ---- Buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;border-radius:999px;font-weight:800;font-size:16px;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  user-select:none;
}
.btn:active{transform:scale(.96);}
.btn-primary{
  background:linear-gradient(135deg,var(--teal),var(--cyan));
  color:#02261f;
  box-shadow:0 6px 24px rgba(45,232,199,.35), inset 0 1px 0 rgba(255,255,255,.4);
}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{
  background:rgba(255,255,255,.05);
  border:1.5px solid var(--line);
  color:var(--ink);
}
.btn-ghost:hover{background:rgba(255,255,255,.09);}
.btn-danger{background:linear-gradient(135deg,var(--danger),#ff8a5b);color:#2a0510;}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:999px;}
.icon-btn{
  width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1.5px solid var(--line);
  font-size:19px;flex-shrink:0;
}

/* ---- Cards / panels ---- */
.panel{
  background:linear-gradient(160deg,var(--bg-panel),var(--bg-panel-2));
  border:1.5px solid var(--line);
  border-radius:var(--radius-l);
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}
.glow-edge{position:relative;}
.glow-edge::after{
  content:"";position:absolute;inset:-1.5px;border-radius:inherit;
  padding:1.5px;background:linear-gradient(135deg,var(--teal),var(--violet),var(--cyan));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  opacity:.55;pointer-events:none;
}

/* ---- Top bar (HUD) ---- */
.hud{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 4px 14px;
}
.hud-group{display:flex;align-items:center;gap:8px;}
.hud-chip{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;
}
.hearts{display:flex;gap:3px;font-size:17px;letter-spacing:1px;}
.heart-lost{opacity:.25;filter:grayscale(1);}

/* ---- Timer ---- */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 16px;}
.timer-ring{position:relative;width:78px;height:78px;}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke-width:7;}
.timer-track{stroke:rgba(255,255,255,.08);}
.timer-bar{stroke:var(--teal);stroke-linecap:round;transition:stroke .3s;}
.timer-num{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;direction:ltr;
}
.timer-wrap.warn .timer-bar{stroke:var(--amber);}
.timer-wrap.warn .timer-num{color:var(--amber);}
.timer-wrap.crit .timer-bar{stroke:var(--danger);}
.timer-wrap.crit .timer-num{color:var(--danger);}
.timer-wrap.crit .timer-ring{animation:pulseRing .55s ease-in-out infinite;}
@keyframes pulseRing{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}

/* ---- Progress / XP ---- */
.xp-bar-track{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid var(--line);}
.xp-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--cyan));transition:width .5s cubic-bezier(.2,.9,.3,1);}

/* ---- Intro / cinematic ---- */
.intro-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:20px 0;}
.dna-badge{font-size:64px;filter:drop-shadow(0 0 22px rgba(45,232,199,.55));animation:floaty 3.2s ease-in-out infinite;}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.brand-line{font-size:13px;color:var(--ink-faint);}
.brand-name{color:var(--teal);font-weight:800;}
.typewriter-box{min-height:64px;display:flex;align-items:center;justify-content:center;padding:0 12px;}
.name-input{
  width:100%;max-width:340px;text-align:center;font-size:19px;font-weight:800;
  padding:14px 18px;border-radius:999px;background:rgba(255,255,255,.06);
  border:1.5px solid var(--line);color:var(--ink);
}
.name-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px rgba(45,232,199,.15);}
.name-input::placeholder{color:var(--ink-faint);}

/* ---- Adventure map ---- */
.map-path{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px 4px 24px;}
.map-node{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--radius-m);
  background:rgba(255,255,255,.04);border:1.5px solid var(--line);position:relative;
}
.map-node.locked{opacity:.45;}
.map-node.done{border-color:var(--teal-dim);}
.map-node-icon{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;font-size:24px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,var(--bg-panel-2),var(--bg-void));
  border:2px solid var(--line);
}
.map-node.unlocked .map-node-icon{border-color:var(--teal);box-shadow:0 0 18px rgba(45,232,199,.45);}
.map-node.done .map-node-icon{border-color:var(--gold);box-shadow:0 0 16px rgba(255,211,92,.4);}
.map-node-body{flex:1;text-align:right;}
.map-node-title{font-weight:800;font-size:15px;}
.map-node-desc{font-size:12px;color:var(--ink-dim);margin-top:2px;}
.map-node-stars{font-size:12px;color:var(--gold);margin-top:4px;letter-spacing:2px;}
.map-connector{width:2px;height:16px;background:linear-gradient(var(--line),transparent);margin-inline-start:40px;}

/* ---- Question host ---- */
.q-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.q-level-tag{font-size:12px;color:var(--violet);font-weight:800;background:rgba(164,91,255,.12);padding:4px 12px;border-radius:999px;}
.q-type-tag{font-size:11px;color:var(--cyan);font-weight:700;}
.q-card{padding:22px 18px;margin-bottom:16px;}
.q-diff{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;margin-bottom:10px;}
.diff-easy{background:rgba(63,224,122,.15);color:var(--ok);}
.diff-medium{background:rgba(63,208,255,.15);color:var(--cyan);}
.diff-hard{background:rgba(255,181,69,.15);color:var(--amber);}
.diff-boss{background:rgba(255,77,109,.15);color:var(--danger);}
.q-text{font-size:18px;font-weight:800;line-height:1.6;}
.q-source{font-size:11px;color:var(--ink-faint);margin-top:8px;}

.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt-btn{
  display:flex;align-items:center;gap:12px;text-align:right;
  padding:14px 16px;border-radius:var(--radius-m);
  background:rgba(255,255,255,.04);border:1.5px solid var(--line);
  font-size:15px;font-weight:600;transition:all .15s ease;
}
.opt-btn:active{transform:scale(.98);}
.opt-letter{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;border:1px solid var(--line);
}
.opt-btn.correct{background:rgba(63,224,122,.14);border-color:var(--ok);}
.opt-btn.correct .opt-letter{background:var(--ok);color:#04250f;border-color:var(--ok);}
.opt-btn.wrong{background:rgba(255,77,109,.14);border-color:var(--danger);}
.opt-btn.wrong .opt-letter{background:var(--danger);color:#2a0510;border-color:var(--danger);}
.opt-btn.disabledopt{opacity:.5;pointer-events:none;}
.opt-btn.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,232,199,.15);}

/* text-input fill-blank */
.fill-input{
  width:100%;padding:14px 16px;border-radius:var(--radius-m);font-size:16px;font-weight:700;
  background:rgba(255,255,255,.05);border:1.5px solid var(--line);color:var(--ink);text-align:center;
}
.fill-input:focus{outline:none;border-color:var(--teal);}

/* Match / Classify / Sequence - drag engine */
.dnd-zone{display:flex;flex-direction:column;gap:14px;}
.dnd-row{display:flex;gap:10px;align-items:flex-start;}
.dnd-col{flex:1;min-width:0;}
.dnd-col-title{font-size:12px;color:var(--ink-dim);font-weight:700;margin-bottom:8px;text-align:center;}
.dnd-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:46px;}
.dnd-chip{
  padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1.5px solid var(--line);font-weight:700;font-size:13.5px;
  cursor:grab;touch-action:none;user-select:none;position:relative;
  transition:box-shadow .15s, border-color .15s, opacity .15s;
}
.dnd-chip.dragging{opacity:0;}
.dnd-chip.placed{cursor:default;}
.dnd-chip.locked-correct{border-color:var(--ok);background:rgba(63,224,122,.12);}
.dnd-chip.locked-wrong{border-color:var(--danger);background:rgba(255,77,109,.12);}
.dnd-chip.sel-pick{border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,232,199,.18);}
.dnd-target{
  min-height:52px;border-radius:12px;border:1.5px dashed var(--line);
  display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;
  background:rgba(255,255,255,.02);font-size:13px;color:var(--ink-dim);font-weight:700;text-align:center;
}
.dnd-target.filled{border-style:solid;background:rgba(255,255,255,.05);color:var(--ink);}
.dnd-target.hover-ok{border-color:var(--teal);background:rgba(45,232,199,.08);}
.dnd-target.right{border-color:var(--ok);background:rgba(63,224,122,.1);}
.dnd-target.wrongt{border-color:var(--danger);background:rgba(255,77,109,.1);}
.dnd-target-label{color:var(--ink-dim);font-weight:800;width:100%;text-align:center;}
.dnd-target.filled{gap:6px;}
.dnd-target .dnd-chip{font-size:12px;padding:7px 10px;}
.seq-list{display:flex;flex-direction:column;gap:8px;}
.seq-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1.5px solid var(--line);font-weight:700;font-size:14px;
  touch-action:none;cursor:grab;
}
.seq-num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.seq-item.dragging{opacity:.3;}
.drag-ghost{position:fixed;z-index:999;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) scale(1.04);box-shadow:0 12px 30px rgba(0,0,0,.5);}

/* Hotspot */
.hotspot-wrap{position:relative;border-radius:var(--radius-m);overflow:hidden;background:rgba(255,255,255,.03);border:1.5px solid var(--line);}
.hotspot-wrap svg{width:100%;height:auto;display:block;}
.hotspot-dot{cursor:pointer;}
.hotspot-dot circle{transition:all .2s;}
.hotspot-dot:hover circle.ring{r:16;}
.hotspot-label{font-size:10px;font-weight:800;fill:var(--ink);}

/* Memory cards */
.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.mem-card{aspect-ratio:3/4;border-radius:12px;position:relative;perspective:600px;cursor:pointer;}
.mem-card-inner{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d;}
.mem-card.flipped .mem-card-inner{transform:rotateY(180deg);}
.mem-face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;padding:6px;text-align:center;}
.mem-back{background:linear-gradient(150deg,var(--bg-panel-2),var(--bg-panel));border:1.5px solid var(--line);font-size:22px;}
.mem-front{background:rgba(45,232,199,.1);border:1.5px solid var(--teal);transform:rotateY(180deg);font-size:11.5px;font-weight:800;line-height:1.3;}
.mem-card.matched .mem-front{background:rgba(63,224,122,.15);border-color:var(--ok);}

/* Feedback toast */
.feedback-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;padding:0 14px calc(14px + var(--safe-b));}
.feedback-card{
  pointer-events:auto;width:100%;max-width:680px;border-radius:var(--radius-l) var(--radius-l) 0 0;
  padding:20px 20px calc(18px + var(--safe-b));
  background:linear-gradient(160deg,var(--bg-panel-2),var(--bg-deep));
  border:1.5px solid var(--line);border-bottom:none;
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
  transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1);
}
.feedback-overlay.show .feedback-card{transform:translateY(0);}
.feedback-head{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;margin-bottom:8px;}
.feedback-head.ok{color:var(--ok);}
.feedback-head.bad{color:var(--danger);}
.feedback-head.timeup{color:var(--amber);}
.feedback-explain{font-size:14px;color:var(--ink-dim);line-height:1.7;background:rgba(255,255,255,.04);padding:12px 14px;border-radius:12px;margin:8px 0;}
.feedback-points{font-weight:800;color:var(--gold);font-size:14px;}

/* Combo banner */
.combo-flash{
  position:fixed;top:calc(18px + var(--safe-t));left:50%;transform:translateX(-50%) scale(.7);
  z-index:70;font-weight:900;font-size:22px;padding:10px 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--amber),var(--danger));color:#2a0a00;
  opacity:0;transition:all .35s cubic-bezier(.3,1.4,.4,1);white-space:nowrap;
  box-shadow:0 8px 28px rgba(255,120,60,.45);
}
.combo-flash.show{opacity:1;transform:translateX(-50%) scale(1);top:calc(30px + var(--safe-t));}

/* Boss */
.boss-portrait{font-size:70px;text-align:center;filter:drop-shadow(0 0 30px rgba(255,77,109,.5));animation:bossFloat 2.6s ease-in-out infinite;}
@keyframes bossFloat{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-8px) rotate(2deg);}}
.boss-hp-track{height:22px;border-radius:999px;background:rgba(255,255,255,.06);border:1.5px solid var(--line);overflow:hidden;position:relative;}
.boss-hp-fill{height:100%;background:linear-gradient(90deg,var(--danger),var(--magenta));transition:width .6s cubic-bezier(.3,.9,.3,1);}
.boss-hp-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.6);}
.boss-phase-tag{text-align:center;font-size:12px;color:var(--danger);font-weight:800;margin:10px 0;letter-spacing:.02em;}

/* Results / Certificate */
.rank-badge{font-size:56px;text-align:center;filter:drop-shadow(0 0 26px rgba(255,211,92,.5));}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.stat-box{background:rgba(255,255,255,.04);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:center;}
.stat-num{font-size:22px;font-weight:900;color:var(--teal);}
.stat-lbl{font-size:11px;color:var(--ink-dim);margin-top:2px;}
.cert-canvas-wrap{border-radius:var(--radius-m);overflow:hidden;border:1.5px solid var(--line);margin:14px 0;}
.cert-canvas-wrap canvas{width:100%;height:auto;display:block;}

/* Admin */
.admin-table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
table.admin-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
table.admin-table th,table.admin-table td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
table.admin-table th{background:rgba(255,255,255,.05);color:var(--ink-dim);font-weight:800;cursor:pointer;position:sticky;top:0;}
table.admin-table tr:hover td{background:rgba(255,255,255,.03);}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
@media(min-width:560px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}

/* particles */
.particle-layer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
.particle{position:absolute;border-radius:50%;opacity:0;}

/* misc */
.footer-brand{margin-top:auto;padding-top:22px;text-align:center;font-size:11px;color:var(--ink-faint);}
.footer-brand b{color:var(--teal-dim);}
.loader-dots span{animation:blink 1.2s infinite;display:inline-block;}
.loader-dots span:nth-child(2){animation-delay:.2s;}
.loader-dots span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,100%{opacity:.2;}50%{opacity:1;}}
.shake{animation:shakeAnim .4s;}
@keyframes shakeAnim{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(3px);}30%,50%,70%{transform:translateX(-5px);}40%,60%{transform:translateX(5px);}}
.pop-in{animation:popIn .35s cubic-bezier(.3,1.5,.4,1);}

function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }

/* ================== 4) نظام الصوت — Web Audio API (بدون ملفات خارجية) ================== */
const SFX = (function(){
  let ctx = null;
  function ensureCtx(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } } return ctx; }
  function tone(freq, start, dur, type, gainPeak){
    const c = ensureCtx(); if(!c || !state.soundOn) return;
    const osc = c.createOscillator(); const gain = c.createGain();
    osc.type = type||'sine'; osc.frequency.setValueAtTime(freq, c.currentTime+start);
    gain.gain.setValueAtTime(0, c.currentTime+start);
    gain.gain.linearRampToValueAtTime(gainPeak||0.18, c.currentTime+start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime+start+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(c.currentTime+start); osc.stop(c.currentTime+start+dur+0.05);
  }
  return {
    correct(){ tone(523.25,0,.14,'sine'); tone(659.25,.09,.16,'sine'); tone(783.99,.18,.22,'sine'); },
    wrong(){ tone(220,0,.18,'sawtooth',.12); tone(174.6,.1,.24,'sawtooth',.12); },
    tick(){ tone(880,0,.045,'square',.05); },
    timeup(){ tone(196,0,.3,'triangle',.15); tone(130.8,.15,.35,'triangle',.13); },
    levelup(){ tone(523.25,0,.12,'triangle'); tone(659.25,.1,.12,'triangle'); tone(783.99,.2,.12,'triangle'); tone(1046.5,.3,.28,'triangle'); },
    combo(){ tone(700,0,.08,'square',.08); tone(900,.06,.1,'square',.08); },
    boss(){ tone(110,0,.35,'sawtooth',.14); tone(146.8,.15,.35,'sawtooth',.14); tone(98,.32,.4,'sawtooth',.16); },
    bossHit(){ tone(392,0,.1,'square',.1); tone(261.6,.08,.16,'square',.1); },
    victory(){ [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.12,.3,'triangle',.16)); },
    certificate(){ tone(392,0,.2,'sine'); tone(523.25,.15,.2,'sine'); tone(659.25,.3,.2,'sine'); tone(783.99,.45,.4,'sine'); },
    click(){ tone(600,0,.05,'square',.05); }
  };
})();

/* ================== 5) محرك المؤقت — دقيق بالكامل (Date.now-based) ================== */
const Timer = (function(){
  let rafId = null;
  let endsAt = 0;
  let totalSec = CONFIG.QUESTION_SECONDS;
  let onTick = null, onExpire = null;
  let expired = false;
  let running = false;

  function start(seconds, tickCb, expireCb){
    stop(); // يضمن عدم استمرار مؤقت السؤال السابق أو بدء مؤقت جديد قبل ظهور السؤال
    totalSec = seconds;
    endsAt = Date.now() + seconds*1000; // اعتماد كامل على الفارق الزمني الحقيقي وليس على عدد الإطارات
    onTick = tickCb; onExpire = expireCb;
    expired = false; running = true;
    loop();
  }
  function loop(){
    if(!running) return;
    const remainMs = endsAt - Date.now();
    const remainSec = Math.max(0, remainMs/1000);
    if(onTick) onTick(remainSec, totalSec);
    if(remainMs <= 0){
      if(!expired){ expired = true; running = false; if(onExpire) onExpire(); }
      return;
    }
    rafId = requestAnimationFrame(loop);
  }
  function stop(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null; onTick = null; onExpire = null;
  }
  function remaining(){ return Math.max(0, (endsAt-Date.now())/1000); }
  return { start, stop, remaining };
})();

function renderTimerRing(remainSec, totalSec){
  const wrap = $('#timerWrap'); if(!wrap) return;
  const pct = clamp(remainSec/totalSec,0,1);
  const r = 33, c = 2*Math.PI*r;
  const bar = $('#timerBarCircle', wrap);
  if(bar) bar.style.strokeDasharray = (c*pct).toFixed(1)+' '+c.toFixed(1);
  const num = $('#timerNum', wrap);
  if(num) num.textContent = fmtTime(Math.ceil(remainSec));
  wrap.classList.remove('warn','crit');
  if(remainSec <= 10){ wrap.classList.add('crit'); }
  else if(remainSec <= 20){ wrap.classList.add('warn'); }
  if(Math.ceil(remainSec) <= 10 && Math.ceil(remainSec) >= 1 && Math.abs(remainSec - Math.round(remainSec)) < 0.06){
    if(window.__lastTick !== Math.ceil(remainSec)){ window.__lastTick = Math.ceil(remainSec); SFX.tick(); }
  }
}

}

/* ================== 6) محرك السحب واللمس — Drag & Drop عام (يدعم الماوس واللمس) ================== */
function makeDraggableChip(chipEl, onDrop){
  function pointerDown(e){
    if(state.answered || chipEl.classList.contains('locked-correct') || chipEl.classList.contains('locked-wrong')) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.preventDefault();
    const rect = chipEl.getBoundingClientRect();
    const ghost = chipEl.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.position='fixed'; ghost.style.width=rect.width+'px';
    ghost.style.left=rect.left+'px'; ghost.style.top=rect.top+'px'; ghost.style.margin='0';
    document.body.appendChild(ghost);
    chipEl.classList.add('dragging');
    function move(ev){
      const x=ev.clientX, y=ev.clientY;
      ghost.style.left=(x-rect.width/2)+'px'; ghost.style.top=(y-rect.height/2)+'px';
      ghost.style.display='none';
      const el=document.elementFromPoint(x,y);
      ghost.style.display='';
      $all('.dnd-target').forEach(t=>t.classList.remove('hover-ok'));
      const t = el && el.closest ? el.closest('.dnd-target') : null;
      if(t && !t.classList.contains('right')) t.classList.add('hover-ok');
    }
    function up(ev){
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      const x=ev.clientX, y=ev.clientY;
      ghost.style.display='none';
      const el=document.elementFromPoint(x,y);
      ghost.remove();
      chipEl.classList.remove('dragging');
      $all('.dnd-target').forEach(t=>t.classList.remove('hover-ok'));
      const t = el && el.closest ? el.closest('.dnd-target') : null;
      if(t) onDrop(t);
    }
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up,{once:true});
  }
  chipEl.addEventListener('pointerdown', pointerDown);
}

      const rect = item.getBoundingClientRect();

      ghost.style.position='fixed'; ghost.style.width=rect.width+'px';
      ghost.style.left=rect.left+'px'; ghost.style.top=rect.top+'px'; ghost.style.margin='0';
      document.body.appendChild(ghost);

      placeholder.className='seq-item';
      placeholder.style.opacity='0.15';

      placeholder.textContent = '';
      item.classList.add('dragging');
      item.style.display='none';
      item.parentNode.insertBefore(placeholder, item);
      function move(ev){
        ghost.style.left=(ev.clientX-rect.width/2)+'px';
        ghost.style.top=(ev.clientY-rect.height/2)+'px';
        const items = $all(sel, container).filter(x=>x!==item);
        let placed=false;
        for(const it of items){
          if(it===placeholder) continue;
          const r=it.getBoundingClientRect();
          if(ev.clientY < r.top+r.height/2){
            container.insertBefore(placeholder, it); placed=true; break;
          }
        }
        if(!placed) container.appendChild(placeholder);
      }
      function up(){
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        ghost.remove();
        item.style.display='';
        item.classList.remove('dragging');
        placeholder.parentNode.insertBefore(item, placeholder);
        placeholder.remove();
        if(onReorderAttempt) onReorderAttempt();
      }
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up,{once:true});
    });
  });
}

function levelQuestions(levelId){ return questionBank.filter(q=>q.level===levelId); }

function startLevel(levelId){
  state.currentLevel = levelId;
  state.currentQueue = shuffle(levelQuestions(levelId));
  state.currentIndex = 0;
  state.levelProgress[levelId] = state.levelProgress[levelId] || {done:false, correct:0, total:state.currentQueue.length};
  state.levelProgress[levelId].total = state.currentQueue.length;
  state.levelProgress[levelId].correct = 0;
  state.screen = 'question';
  renderApp();
}

function currentQuestion(){ return state.currentQueue[state.currentIndex]; }

function computeScore(diffKey, timeTakenSec, comboAfter){
  let base = CONFIG.POINTS[diffKey] || CONFIG.POINTS.medium;
  let bonus = 0;
  if(timeTakenSec <= CONFIG.SPEED_BONUS.fast.maxSeconds) bonus = CONFIG.SPEED_BONUS.fast.bonus;
  else if(timeTakenSec <= CONFIG.SPEED_BONUS.medium.maxSeconds) bonus = CONFIG.SPEED_BONUS.medium.bonus;
  let subtotal = base + bonus;
  let mult = 1;
  if(comboAfter>=10) mult = CONFIG.COMBO_BONUS[10];
  else if(comboAfter>=5) mult = CONFIG.COMBO_BONUS[5];
  else if(comboAfter>=3) mult = CONFIG.COMBO_BONUS[3];
  return Math.round(subtotal*mult);
}

function flashCombo(comboVal){
  const layer = $('#comboLayer'); if(!layer) return;
  let txt = '';
  if(comboVal===3) txt='🔥 COMBO x3';
  else if(comboVal===5) txt='🔥🔥 COMBO x5';
  else if(comboVal>=10) txt='🔥🔥🔥 HUNTER COMBO';
  else return;
  const el = document.createElement('div');
  el.className='combo-flash'; el.textContent = txt;
  layer.appendChild(el);
  SFX.combo();
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),400); }, 1300);
}

function spawnParticles(kind){
  const layer = $('#particleLayer'); if(!layer) return;
  const n = 18; const colors = kind==='ok' ? ['#2de8c7','#3fd0ff','#3fe07a'] : ['#ff4d6d','#ff8a5b'];
  for(let i=0;i<n;i++){
    const p = document.createElement('div'); p.className='particle';
    const size = 4+Math.random()*6;
    p.style.width=size+'px'; p.style.height=size+'px';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.left = (45+Math.random()*10)+'vw'; p.style.top = (55+Math.random()*10)+'vh';
    layer.appendChild(p);
    const dx = (Math.random()-0.5)*260, dy = -(Math.random()*260+60);
    p.animate([
      {transform:'translate(0,0)', opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px)', opacity:0}
    ], {duration:900+Math.random()*500, easing:'cubic-bezier(.2,.7,.3,1)'});
    setTimeout(()=>p.remove(), 1500);
  }
}

/* ---- دورة حياة الإجابة: صحيح / خطأ / انتهاء الوقت ---- */
let __answerLock = false;
function finalizeAnswer(result, q, timeTakenSec, opts){
  opts = opts || {};
  if(state.answered) return;
  state.answered = true;
  Timer.stop();
  const isBoss = !!opts.isBoss;
  timeTakenSec = clamp(timeTakenSec, 0, CONFIG.QUESTION_SECONDS);
  state.questionTimes.push(timeTakenSec);
  state.totalQuestions++;

  let pointsEarned = 0;
  if(result===true){
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    state.correctCount++;
    const diffKey = isBoss ? 'boss' : (q.difficulty||'medium');
    pointsEarned = computeScore(diffKey, timeTakenSec, state.combo);
    state.score += pointsEarned;
    if(!isBoss && state.levelProgress[state.currentLevel]) state.levelProgress[state.currentLevel].correct++;
    if(isBoss){ state.bossHP = Math.max(0, state.bossHP - (100/bossPhases.length)); SFX.bossHit(); }
    else { SFX.correct(); }
    spawnParticles('ok');
    if([3,5,10].includes(state.combo) || state.combo>10) flashCombo(state.combo>=10?10:state.combo);
  } else {
    state.combo = 0;
    state.lives = Math.max(0, state.lives-1);
    if(result===false){ state.wrongCount++; SFX.wrong(); }
    else { state.unansweredCount++; SFX.timeup(); }
  }
  if(isBoss){
    const fillEl = $('#bossHpFill');
    if(fillEl){ fillEl.style.width = state.bossHP+'%'; const lbl=$('.boss-hp-label'); if(lbl) lbl.textContent = Math.round(state.bossHP)+'%'; }
  }

  showFeedback(result, q, pointsEarned, isBoss);
}

function showFeedback(result, q, pointsEarned, isBoss){
  const hostEl = $('#challengeHost'); if(hostEl) hostEl.style.pointerEvents = 'none';
  const layer = $('#feedbackLayer');
  let headClass = result===true?'ok':(result===false?'bad':'timeup');
  let headText = result===true ? '✨ إجابة صحيحة!' : (result===false ? '❌ إجابة غير صحيحة' : '⏰ انتهى الوقت!');
  let ansLine = '';
  if(result!==true){
    ansLine = '<div class="feedback-explain"><b>الإجابة الصحيحة:</b><br>'+correctAnswerText(q)+'</div>';
  }
  layer.innerHTML =
    '<div class="feedback-overlay" id="fbOverlay">'
    +'<div class="feedback-card panel pop-in">'
    +'<div class="feedback-head '+headClass+'">'+headText+'</div>'
    + ansLine
    +'<div class="feedback-explain"><b>لماذا؟</b><br>'+esc(q.explanation||'')+'</div>'
    + (q.sourceReference ? '<div class="q-source">📖 '+esc(q.sourceReference)+'</div>' : '')
    + (result===true ? '<div class="feedback-points">+'+pointsEarned+' نقطة</div>' : '')
    +'<button class="btn btn-primary btn-block" id="fbNextBtn" style="margin-top:14px;">متابعة</button>'
    +'</div></div>';
  requestAnimationFrame(()=>$('#fbOverlay').classList.add('show'));
  $('#fbNextBtn').addEventListener('click', ()=>{
    layer.querySelector('.feedback-overlay').classList.remove('show');
    setTimeout(()=>{ layer.innerHTML=''; afterAnswerAdvance(isBoss); }, 260);
  });
}

function correctAnswerText(q){
  if(q.type==='mcq' || q.type==='diagnosis' || q.type==='graph'){ return esc(q.options[q.answer]); }
  if(q.type==='fillblank'){ return esc(q.accepted[0]); }
  if(q.type==='match'){ return q.pairs.map(p=>esc(p.left)+' ⇦ '+esc(p.right)).join('<br>'); }
  if(q.type==='classify'){
    const byBucket = {};
    q.items.forEach(it=>{ (byBucket[it.bucket]=byBucket[it.bucket]||[]).push(it.label); });
    return Object.keys(byBucket).map(b=>'<b>'+esc(b)+':</b> '+byBucket[b].map(esc).join('، ')).join('<br>');
  }
  if(q.type==='sequence'){ return q.steps.map((s,i)=>(i+1)+'. '+esc(s)).join('<br>'); }
  if(q.type==='hotspot'){
    const d = buildHotspotSVG(q.svgKind); const sp = d.spots.find(s=>s.id===q.targetId);
    return esc(sp?sp.label:'');
  }
  return '';
}

function afterAnswerAdvance(isBoss){
  if(state.lives<=0){ state.screen='gameover'; renderApp(); return; }
  if(isBoss){
    state.bossIndex++;
    if(state.bossIndex>=bossPhases.length){ finishGame(); return; }
    renderApp(); return;
  }
  state.currentIndex++;
  if(state.currentIndex>=state.currentQueue.length){
    // انتهت المرحلة
    if(state.levelProgress[state.currentLevel]) state.levelProgress[state.currentLevel].done = true;
    SFX.levelup();
    state.screen='levelComplete';
    renderApp();
    return;
  }
  state.answered=false;
  renderApp();
}

function finishGame(){
  state.screen = 'results';
  state.attemptId = uid();
  saveAndSyncAttempt();
  renderApp();
}

/* ---- MCQ / Diagnosis / Graph ---- */
/* ---- عشوائية عرض الاختيارات: الإجابة الصحيحة تُخزَّن مستقلة تماماً عن موضع العرض ----
   نبني "نسخة عرض" (view) مشوّشة بخوارزمية Fisher-Yates من نفس shuffle() العامة،
   كل عنصر فيها يحمل orig = فهرسه الأصلي في q.options (حيث q.answer ثابت ولا يتغير أبداً).
   العرض (أ/ب/ج/د) يُبنى من ترتيب الـview بعد الخلط، فتتغيّر مواضع الإجابة الصحيحة
   في كل مرة يُعرض فيها نفس السؤال (محاولة جديدة، طالب آخر، إعادة اللعب...). */
function shuffleOptionsView(options){
  return shuffle(options.map((text,i)=>({text:text, orig:i})));
}
function challengeMCQ(q, isBoss){
  let html = '';
  if(q.type==='graph') html += '<div class="hotspot-wrap" style="padding:10px;margin-bottom:16px;">'+buildGraphSVG(q.graphKind)+'</div>';
  const view = shuffleOptionsView(q.options);
  html += '<div class="opt-list" id="optList">';
  view.forEach((opt,i)=>{
    html += '<button class="opt-btn" data-orig="'+opt.orig+'"><span class="opt-letter">'+ARABIC_LETTERS[i]+'</span><span>'+esc(opt.text)+'</span></button>';
  });
  html += '</div>';
  return html;
}
function wireMCQ(q, isBoss){
  const qStart = Date.now();
  $all('#optList .opt-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered) return;
      const orig = +btn.dataset.orig;
      const correct = orig===q.answer;
      $all('#optList .opt-btn').forEach(b=>{
        const bOrig = +b.dataset.orig;
        b.classList.add('disabledopt');
        if(bOrig===q.answer) b.classList.add('correct');
        if(b===btn && !correct) b.classList.add('wrong');
      });
      const t = (Date.now()-qStart)/1000;
      finalizeAnswer(correct, q, t, {isBoss});
    });
  });
}

/* ---- Fill in the blank ---- */
function challengeFillblank(q, isBoss){

    +'<input type="text" class="fill-input" id="fillInput" placeholder="اكتب إجابتك هنا" autocomplete="off">'
    +'<button class="btn btn-primary btn-block" id="fillSubmit" style="margin-top:14px;">تحقق ✅</button>'
    +'</div>';
}
function normalizeAr(s){
  return String(s||'').trim().replace(/[إأآا]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').toLowerCase();
}
function wireFillblank(q, isBoss){
  const qStart = Date.now();
  const submit = ()=>{
    if(state.answered) return;
    const val = $('#fillInput').value;
    const norm = normalizeAr(val);
    const correct = q.accepted.some(a=>normalizeAr(a)===norm) && norm.length>0;
    $('#fillInput').disabled = true;
    $('#fillInput').style.borderColor = correct? 'var(--ok)':'var(--danger)';
    const t = (Date.now()-qStart)/1000;
    finalizeAnswer(correct, q, t, {isBoss});
  };
  $('#fillSubmit').addEventListener('click', submit);
  $('#fillInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* ---- Match (وصل بالسحب) ---- */
function challengeMatch(q, isBoss){
  const leftItems = shuffle(q.pairs.map((p,i)=>({key:'L'+i, text:p.left, pairIndex:i})));
  const rightItems = shuffle(q.pairs.map((p,i)=>({key:'R'+i, text:p.right, pairIndex:i})));
  let html = '<div class="dnd-zone">';
  html += '<div class="dnd-col-title">اسحب كل عنصر من الأعلى إلى الهدف الصحيح بالأسفل</div>';
  html += '<div class="dnd-pool" id="dndPool">';
  leftItems.forEach(it=> html += '<div class="dnd-chip" data-pair="'+it.pairIndex+'" data-key="'+it.key+'">'+esc(it.text)+'</div>');

/* ---- محرك سحب/إفلات عام (يُستخدم في match و classify) ----
   singleSlot=true (match): كل هدف يقبل عنصراً واحداً فقط فيُغلق بعد أول إفلات صحيح.
   singleSlot=false (classify): كل مجموعة (هدف) تقبل أكثر من عنصر، فلا يُغلق الهدف أبداً. */
function wireDndGeneric(q, isBoss, matchAttr, singleSlot){
  const qStart = Date.now();
  const chips = $all('#dndPool .dnd-chip');
  const total = chips.length;
  let placed = 0, allCorrect = true;
  chips.forEach(chip=>{
    makeDraggableChip(chip, function(targetEl){
      if(chip.classList.contains('locked-correct') || chip.classList.contains('locked-wrong')) return;
      if(singleSlot && targetEl.classList.contains('right')) return; // الهدف ممتلئ بالفعل بعنصر صحيح (match فقط)
      const chipVal = chip.dataset[matchAttr];
      const targetVal = targetEl.dataset[matchAttr];
      const isRight = chipVal === targetVal;
      chip.classList.add(isRight?'locked-correct':'locked-wrong');
      chip.classList.add('placed');
      chip.style.cursor='default';
      targetEl.appendChild(chip);
      if(singleSlot){ targetEl.classList.add(isRight?'right':'wrongt','filled'); }
      else { targetEl.classList.add('filled'); if(!isRight) targetEl.classList.add('wrongt'); }
      if(!isRight) allCorrect = false;
      placed++;
      if(placed>=total){
        SFX.click();
        setTimeout(()=>{ const t=(Date.now()-qStart)/1000; finalizeAnswer(allCorrect, q, t, {isBoss}); }, 350);
      }
    });
  });
}

}
function wireSequence(q, isBoss){

/* ---- Memory Cards ---- */
function challengeMemory(q, isBoss){
  const cards = [];
  q.pairs.forEach((p,i)=>{ cards.push({pairIndex:i,text:p.a}); cards.push({pairIndex:i,text:p.b}); });
  const shuffled = shuffle(cards);
  let html = '<div class="memory-grid" id="memGrid">';
  shuffled.forEach((c,i)=>{
    html += '<div class="mem-card" data-pair="'+c.pairIndex+'" data-idx="'+i+'">'
      +'<div class="mem-card-inner">'
      +'<div class="mem-face mem-back">🧬</div>'
      +'<div class="mem-face mem-front">'+esc(c.text)+'</div>'
      +'</div></div>';
  });
  html += '</div><div class="sub" style="text-align:center;margin-top:10px;">اقلب بطاقتين لإيجاد العلاقة الصحيحة</div>';
  return html;
}
function wireMemory(q, isBoss){
  const qStart = Date.now();
  const total = q.pairs.length;
  let matched = 0, lock=false, first=null;
  $all('.mem-card', $('#memGrid')).forEach(card=>{
    card.addEventListener('click', ()=>{
      if(state.answered || lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      if(!first){ first = card; return; }
      const second = card;
      lock = true;
      const isMatch = first.dataset.pair===second.dataset.pair && first!==second;
      setTimeout(()=>{
        if(isMatch){
          first.classList.add('matched'); second.classList.add('matched');
          matched++;
          SFX.click();
          if(matched>=total){
            const t=(Date.now()-qStart)/1000;
            finalizeAnswer(true, q, t, {isBoss});
          }
        } else {
          first.classList.remove('flipped'); second.classList.remove('flipped');
        }
        first=null; lock=false;
      }, isMatch?450:700);
    });
  });
}

/* ---- المرحلة الخامسة للزعيم: التحدي السريع (Speed Run) ----
   ملحوظة مهمة: كل سؤال فرعي داخل التحدي السريع له مؤقت 60 ثانية كاملة ومستقل بذاته،
   تماماً كأي سؤال آخر في اللعبة — لا يوجد استثناء لمدة الأسئلة داخل Speed Run. */
function renderSpeedPhase(phase){
  let html = '<div class="panel glow-edge q-card" id="speedCard">';
  html += '<span class="q-diff diff-boss">⚡ تحدي سريع • '+CONFIG.POINTS.boss+' نقطة</span>';
  html += '<div class="q-text" id="speedQText"></div></div>';
  html += '<div class="opt-list" id="speedOptList"></div>';
  html += '<div class="sub" id="speedProgress" style="text-align:center;margin-top:10px;"></div>';
  return html;
}
let __speedState = null;
function wireSpeedPhase(phase){
  __speedState = { idx:0, correctAll:true, timedOut:false, startAll:Date.now() };
  renderSpeedItem(phase);
}
function renderSpeedItem(phase){
  const it = phase.items[__speedState.idx];
  $('#speedQText').textContent = it.q;
  $('#speedProgress').textContent = 'سؤال '+(__speedState.idx+1)+' من '+phase.items.length+' — ⏱️ 60 ثانية لهذا السؤال';
  const list = $('#speedOptList'); list.innerHTML='';
  let locked = false;
  const view = shuffleOptionsView(it.options); // عشوائية موضع الإجابة الصحيحة، مستقلة عن it.answer
  function lockButtons(chosenOrig){
    $all('.opt-btn',list).forEach(bb=>{
      const bOrig = +bb.dataset.orig;
      bb.classList.add('disabledopt');
      if(bOrig===it.answer) bb.classList.add('correct');
      if(chosenOrig!==null && bOrig===chosenOrig && bOrig!==it.answer) bb.classList.add('wrong');
    });
  }
  function advance(){
    Timer.stop();
    __speedState.idx++;
    if(__speedState.idx>=phase.items.length){
      const t=(Date.now()-__speedState.startAll)/1000;
      const finalResult = __speedState.timedOut ? null : __speedState.correctAll;
      finalizeBossAnswer(finalResult, phase, t);
    } else { renderSpeedItem(phase); }
  }
  view.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className='opt-btn'; b.dataset.orig = opt.orig;
    b.innerHTML = '<span class="opt-letter">'+ARABIC_LETTERS[i]+'</span><span>'+esc(opt.text)+'</span>';
    b.addEventListener('click', ()=>{
      if(state.answered || locked) return;
      locked = true;
      const orig = +b.dataset.orig;
      const correct = orig===it.answer;
      if(!correct) __speedState.correctAll = false;
      lockButtons(orig);
      SFX[correct?'correct':'wrong']();
      setTimeout(advance, 650);
    });
    list.appendChild(b);
  });
  // مؤقت مستقل كامل (60 ثانية) لهذا السؤال الفرعي تحديداً
  Timer.start(CONFIG.QUESTION_SECONDS, renderTimerRing, ()=>{
    if(state.answered || locked) return;
    locked = true;
    __speedState.correctAll = false;
    __speedState.timedOut = true;
    lockButtons(null);
    SFX.timeup();
    setTimeout(advance, 900);
  });
}

function finalizeBossAnswer(result, phase, timeTakenSec){
  // غلاف رفيع فوق finalizeAnswer الموحّد لضمان نفس منطق النقاط/الأرواح/الكومبو/شريط صحة الزعيم
  // في كل أنواع تحديات الزعيم (Hotspot, Match, Sequence, Diagnosis, Classify, Speed)
  finalizeAnswer(result, phase, timeTakenSec, {isBoss:true});
}

function computeRank(){
  const total = state.totalQuestions || 1;

function drawCertificate(canvas, data){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#0a1626'); grad.addColorStop(.5,'#0f1f33'); grad.addColorStop(1,'#142943');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  // إطار زخرفي
  ctx.strokeStyle = '#2de8c7'; ctx.lineWidth = 6; ctx.strokeRect(24,24,W-48,H-48);
  ctx.strokeStyle = 'rgba(164,91,255,.6)'; ctx.lineWidth = 2; ctx.strokeRect(40,40,W-80,H-80);
  // زخرفة جزيئية بسيطة
  ctx.save();
  for(let i=0;i<26;i++){
    ctx.beginPath();
    const x = 60+Math.random()*(W-120), y=60+Math.random()*(H-120), r=1.4+Math.random()*2.2;
    ctx.fillStyle = 'rgba(63,208,255,'+(0.15+Math.random()*0.35).toFixed(2)+')';
    ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  ctx.direction='rtl'; ctx.textAlign='center';
  ctx.fillStyle = '#3fd0ff'; ctx.font='700 30px Tajawal, Arial';
  ctx.fillText('🧬 '+CONFIG.GAME_TITLE, W/2, 118);

  ctx.fillStyle = '#eaf6ff'; ctx.font='600 22px Tajawal, Arial';

  ctx.fillStyle = '#2de8c7'; ctx.font='900 40px Cairo, Arial';
  ctx.fillText(data.rank, W/2, 450);
  // إحصائيات
  const statsY = 530;
  drawCertStat(ctx, W*0.22, statsY, 'Score', String(data.score));
  drawCertStat(ctx, W*0.5, statsY, 'Accuracy', data.pct+'%');
  drawCertStat(ctx, W*0.78, statsY, 'Certificate ID', data.certId);

  ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.beginPath(); ctx.moveTo(140,700); ctx.lineTo(W-140,700); ctx.stroke();

async function downloadCertificatePNG(){
  const canvas = $('#certCanvas');
  const filename = 'شهادة-'+(state.studentName||'صياد')+'.png';
  canvas.toBlob(async function(blob){
    if(!blob) return;
    // إن كانت الصفحة تعمل كـ Artifact منشور، نستخدم قدرة downloads الخاصة بالمنصة
    // (تعرض تأكيداً على المستخدم قبل الحفظ)؛ وإلا (كملف HTML عادي مفتوح مباشرة)
    // نستخدم الطريقة التقليدية عبر رابط تنزيل Blob كما كانت.
    let downloadsCap = null;
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        downloadsCap = await window.claude.use('downloads');
      }
    }catch(e){ downloadsCap = null; }
    if(downloadsCap){
      try{ await downloadsCap.save({ filename, data: blob }); }catch(err){ /* المستخدم رفض الحفظ أو تعذّر ذلك — لا نلتف حول قراره */ }
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }, 'image/png');
}
function printCertificate(){
  const canvas = $('#certCanvas');
  const dataUrl = canvas.toDataURL('image/png');
  const w = window.open('', '_blank');
  if(!w){ alert('يرجى السماح بالنوافذ المنبثقة للطباعة'); return; }
  w.document.write('<html><head><title>شهادة '+esc(state.studentName)+'</title><style>body{margin:0;display:flex;align-items:center;justify-content:center;background:#0a1626;}img{max-width:100%;}@media print{body{background:#fff;}}</style></head><body><img src="'+dataUrl+'" onload="window.print();"></body></html>');
  w.document.close();
}

    timestamp: new Date().toISOString()
  };
}
function readLocalAttempts(){
  try{ return JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY)||'[]'); }catch(e){ return []; }
}
function writeLocalAttempts(list){
  try{ localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(list)); }catch(e){}
}
function readPendingSync(){
  try{ return JSON.parse(localStorage.getItem(CONFIG.PENDING_SYNC_KEY)||'[]'); }catch(e){ return []; }
}
function writePendingSync(list){
  try{ localStorage.setItem(CONFIG.PENDING_SYNC_KEY, JSON.stringify(list)); }catch(e){}
}
function saveAndSyncAttempt(){
  const record = buildAttemptRecord();
  const all = readLocalAttempts();
  all.push(record); // لا يُحذف أي سجل سابق أبداً — محاولة جديدة فقط تُضاف
  writeLocalAttempts(all);
  trySyncOne(record);
}
function trySyncOne(record){
  if(!CONFIG.GOOGLE_SCRIPT_URL || CONFIG.GOOGLE_SCRIPT_URL.indexOf('PUT_YOUR_URL_HERE')>=0){
    const pending = readPendingSync(); pending.push(record); writePendingSync(pending);
    return;
  }
  fetch(CONFIG.GOOGLE_SCRIPT_URL, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'logAttempt', payload: record })
  }).then(()=>{
    // في وضع no-cors لا يمكن قراءة الاستجابة، نفترض النجاح ونزيل من الطابور المعلّق إن وجد
    removeFromPending(record.certificateId);
  }).catch(()=>{
    const pending = readPendingSync(); pending.push(record); writePendingSync(pending);
  });
}
function removeFromPending(certId){
  const pending = readPendingSync().filter(r=>r.certificateId!==certId);
  writePendingSync(pending);
}
function flushPendingSync(){
  if(!CONFIG.GOOGLE_SCRIPT_URL || CONFIG.GOOGLE_SCRIPT_URL.indexOf('PUT_YOUR_URL_HERE')>=0) return;
  const pending = readPendingSync();
  if(!pending.length) return;
  pending.forEach(record=>{
    fetch(CONFIG.GOOGLE_SCRIPT_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'logAttempt', payload: record })
    }).then(()=> removeFromPending(record.certificateId)).catch(()=>{});
  });
}
window.addEventListener('online', flushPendingSync);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') flushPendingSync(); });

function computeKPIs(rows){
  if(!rows.length) return {students:0, attempts:0, topScore:0, avgPct:0, avgTime:0, topCombo:0, timeouts:0};
  const students = new Set(rows.map(r=>r.studentName)).size;
  const topScore = Math.max(...rows.map(r=>+r.score||0));
  const avgPct = Math.round(rows.reduce((a,r)=>a+(+r.percentage||0),0)/rows.length);
  const avgTime = Math.round(rows.reduce((a,r)=>a+(+r.totalTime||0),0)/rows.length);
  const topCombo = Math.max(...rows.map(r=>+r.highestCombo||0));
  const timeouts = rows.reduce((a,r)=>a+(+r.unanswered||0),0);
  return {students, attempts:rows.length, topScore, avgPct, avgTime, topCombo, timeouts};
}

/* ================== 16) اختبار داخلي (QA) — التحقق من عشوائية موضع الإجابة الصحيحة ==================
   يتأكد أن الإجابة الصحيحة ليست مرتبطة بشكل ثابت بموضع واحد (مثل "أ" دائماً)،
   وأن نظام الخلط (shuffleOptionsView المبني على Fisher-Yates عبر shuffle() العامة)
   يوزّع الإجابة الصحيحة على مواضع مختلفة (أ/ب/ج/د) عبر محاولات متكررة لنفس السؤال. */
function runShuffleQA(sampleSize, trialsPerQuestion){
  sampleSize = sampleSize || 6;
  trialsPerQuestion = trialsPerQuestion || 60;
  const mcqPool = questionBank.filter(q=>['mcq','diagnosis','graph'].includes(q.type) && q.options && q.options.length>=3);
  const sample = shuffle(mcqPool).slice(0, Math.min(sampleSize, mcqPool.length));
  const report = sample.map(q=>{
    const positions = {};
    for(let t=0;t<trialsPerQuestion;t++){
      const view = shuffleOptionsView(q.options);
      const pos = view.findIndex(o=>o.orig===q.answer);
      positions[pos] = (positions[pos]||0)+1;
    }
    const distinctPositions = Object.keys(positions).length;
    return { id:q.id, distribution:positions, distinctPositions, pass: distinctPositions>1 };
  });
  const allPass = report.every(r=>r.pass);
  try{
    console.log('%c[QA] اختبار عشوائية مواضع الإجابة الصحيحة', 'color:#2de8c7;font-weight:bold;');
    report.forEach(r=> console.log(' -', r.id, 'توزيع المواضع (0=أ,1=ب,2=ج,3=د):', r.distribution, r.pass?'✅ متغيّر':'❌ ثابت!'));
    console.log(allPass ? '✅ [QA] كل الأسئلة المختبرة توزّع إجاباتها الصحيحة على أكثر من موضع — الخلط يعمل بشكل سليم.' : '❌ [QA] رصد سؤال لا يزال ثابت الموضع — يلزم مراجعة.');
  }catch(e){}
  return { allPass, report };
}
window.runShuffleQA = runShuffleQA; // يمكن استدعاؤها يدوياً من الـ Console: runShuffleQA()

/* ================== اختبار QA أعمق: "لعب" 10 أسئلة MCQ فعلية + Speed Run ==================
   بخلاف runShuffleQA (التي تختبر أداة الخلط shuffleOptionsView مباشرة)، هذا الاختبار يستدعي
   دالة العرض الحقيقية المستخدمة فعلياً أثناء اللعب (challengeMCQ) وأثناء التحدي السريع
   (نفس سطر الخلط داخل renderSpeedItem)، ثم يقرأ HTML الناتج فعلياً (data-orig) بنفس الطريقة
   التي تقرأها wireMCQ عند الضغط، للتأكد أن المسار الكامل من العرض حتى تحديد الإجابة الصحيحة
   يعمل بشكل صحيح وغير متحيّز لموضع "أ". */
function extractOrigSequenceFromHTML(html){
  const re = /data-orig="(\d+)"/g;
  const seq = []; let m;
  while((m = re.exec(html))) seq.push(+m[1]);
  return seq;
}
function runPlaythroughQA(){
  const letters = ['أ','ب','ج','د','هـ'];
  const pool = questionBank.filter(q=>['mcq','diagnosis','graph'].includes(q.type));
  const sample = shuffle(pool).slice(0, 10); // محاكاة "لعب" 10 أسئلة MCQ حقيقية من بنك الأسئلة
  const mcqRows = sample.map(q=>{
    const html = challengeMCQ(q, false);                 // نفس دالة العرض الحقيقية في اللعب الفعلي
    const seq = extractOrigSequenceFromHTML(html);        // ترتيب data-orig كما سيظهر في الشاشة فعلياً
    const posOfCorrect = seq.indexOf(q.answer);           // الموضع الذي هبطت فيه الإجابة الصحيحة
    // محاكاة نقرة الطالب على الزر "الصحيح" ثم نقرة على زر خاطئ، بنفس منطق wireMCQ تماماً (orig===q.answer)
    const clickCorrectResult = (q.answer === q.answer);   // نفس شرط wireMCQ
    const wrongOrig = seq.find(o=>o!==q.answer);
    const clickWrongResult = (wrongOrig === q.answer);    // يجب أن تكون false دائماً
    return { id:q.id, letter:letters[posOfCorrect], posIndex:posOfCorrect, clickCorrectOK: clickCorrectResult===true, clickWrongOK: clickWrongResult===false };
  });

  // Speed Run: نفس سطر الخلط المستخدم فعلياً داخل renderSpeedItem، لكل سؤال فرعي، عبر عدة محاولات
  const speedPhase = bossPhases.find(p=>p.type==='speed');
  const speedRows = [];
  speedPhase.items.forEach((it,idx)=>{
    for(let attempt=1; attempt<=4; attempt++){
      const view = shuffleOptionsView(it.options); // نفس السطر المستخدم حرفياً في renderSpeedItem
      const posIndex = view.findIndex(o=>o.orig===it.answer);
      speedRows.push({ item:idx+1, attempt, letter:letters[posIndex] });
    }
  });

  const mcqLetters = mcqRows.map(r=>r.letter);
  const distinctMcqLetters = new Set(mcqLetters).size;
  const allAOnly = mcqLetters.every(l=>l==='أ');
  const scoringOK = mcqRows.every(r=>r.clickCorrectOK && r.clickWrongOK);
  const speedDistinct = new Set(speedRows.map(r=>r.letter)).size;

  console.log('%c[QA-Playthrough] محاكاة لعب 10 أسئلة MCQ حقيقية + التحدي السريع', 'color:#ffd35c;font-weight:bold;');
  console.table(mcqRows.map(r=>({ السؤال:r.id, 'موضع الإجابة الصحيحة':r.letter, 'تقييم النقر صحيح':r.clickCorrectOK?'✅':'❌', 'تقييم النقر خاطئ':r.clickWrongOK?'✅':'❌' })));
  console.log('مواضع مختلفة ظهرت خلال 10 أسئلة:', distinctMcqLetters, '(المطلوب: أكثر من موضع واحد)');
  console.log('هل كل الإجابات وقعت في "أ" فقط؟', allAOnly ? '❌ نعم (خطأ!)' : '✅ لا');
  console.table(speedRows.map(r=>({ 'سؤال Speed Run رقم':r.item, 'محاولة':r.attempt, 'موضع الإجابة الصحيحة':r.letter })));
  console.log('مواضع مختلفة ظهرت في أسئلة Speed Run:', speedDistinct);

  const pass = distinctMcqLetters>1 && !allAOnly && scoringOK && speedDistinct>1;
  console.log(pass ? '✅ [QA-Playthrough] نجح: تنوّع حقيقي في المواضع + التسجيل صحيح بعد الخلط.' : '❌ [QA-Playthrough] فشل: راجع النتائج أعلاه.');
  return { pass, mcqRows, speedRows, distinctMcqLetters, speedDistinct };
}
window.runPlaythroughQA = runPlaythroughQA; // استدعِها يدوياً من الـ Console: runPlaythroughQA()
